name: alimentabot

# Ambiente local de desenvolvimento. O frontend continua usando o mock/localStorage
# por padrão; a API é exposta separadamente para a evolução e os testes do backend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alimentabot
      POSTGRES_USER: alimentabot
      POSTGRES_PASSWORD: alimentabot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alimentabot -d alimentabot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alimentabot_test
      POSTGRES_USER: alimentabot_test
      POSTGRES_PASSWORD: alimentabot_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alimentabot_test -d alimentabot_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: python:3.11-slim
    working_dir: /workspace/backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://alimentabot:alimentabot@db:5432/alimentabot
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >-
      sh -c "pip install --no-cache-dir -e '.[dev]' &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /workspace
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_test_data:
  web_node_modules:
