services:
  - type: web
    name: alimentabot-api
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e "backend[dev]"
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DEMO_MODE_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
databases:
  - name: alimentabot-postgres
    plan: basic-256mb
    databaseName: alimentabot
    user: alimentabot
